# Кампания: кому и что отправить. Фильтр меняется здесь (или флагами -w в командной строке),
# в коде ничего не зашито. Список воронок, стадий и полей: python -m bitrix_mailer fields
name = "Холодная база — осеннее предложение"

# Ключ «этого письма» для истории: кто уже получил письмо с этим ключом, повторно не получит.
key = "cold-autumn-2026"

subject = '{{contact.NAME|default:"Добрый день"}}, предложение для вас'
template = "../templates/example.html"   # или body = """<p>...</p>"""

# Кому из контактов сделки писать:
#   primary    — только основному контакту (по умолчанию)
#   all        — всем связанным контактам
#   valid_only — всем связанным контактам, у которых есть валидный email
contact_mode = "primary"

# Одинаковый email в нескольких сделках — отправить один раз
dedupe_email = true

[filter]
"Воронка" = "Холодная"
"Стадия" = "Свободные"
# "Ответственный" = "Иван Иванов"
# "Сумма" = "> 100000"
# "Дата создания" = "последние 30 дней"
# "Источник" = ["Звонок", "Веб-сайт"]     # любое из значений
# "UF_CRM_1700000000" = "Москва"           # любое поле сделки по коду или названию

# Условия, передаваемые в crm.deal.list как есть (для сложных случаев)
# [filter.raw]
# "!SOURCE_ID" = "PARTNER"

[history]
# Дополнительно искать уже отправленные письма в самом Битрикс24 по части темы
# (например, если часть писем отправляли вручную). Пусто — только локальная история.
bitrix_subject_contains = ""
